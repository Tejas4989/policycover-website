  <path d="M136 92 Q142 96 148 92" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <line x1="136" y1="92" x2="134" y2="102" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="142" y1="96" x2="142" y2="106" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="148" y1="92" x2="150" y2="102" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
