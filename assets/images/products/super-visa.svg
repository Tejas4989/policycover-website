<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Passport booklet back cover (slightly offset) -->
  <rect x="62" y="42" width="84" height="112" rx="6" fill="white" opacity="0.4"/>
  <!-- Passport booklet front cover -->
  <rect x="54" y="46" width="84" height="112" rx="6" fill="white" opacity="0.9"/>
  <!-- Spine fold line -->
  <line x1="85" y1="46" x2="85" y2="158" stroke="white" stroke-width="2" opacity="0.5"/>
  <!-- Cover border -->
  <rect x="58" y="50" width="76" height="104" rx="4" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <!-- Maple leaf centered on cover -->
  <path d="M96 78 L93 86 L85 84 L89 90 L83 93 L91 95 L89 103 L96 97 L103 103 L101 95 L109 93 L103 90 L107 84 L99 86 Z" fill="white" opacity="0.6"/>
  <!-- Maple leaf stem -->
  <line x1="96" y1="103" x2="96" y2="108" stroke="white" stroke-width="2" opacity="0.6"/>
  <!-- Page lines (suggesting open pages on right) -->
  <line x1="90" y1="118" x2="126" y2="118" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <line x1="90" y1="126" x2="126" y2="126" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <line x1="90" y1="134" x2="120" y2="134" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <!-- Globe/star detail at bottom -->
  <circle cx="96" cy="148" r="6" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="90" y1="148" x2="102" y2="148" stroke="white" stroke-width="1" opacity="0.5"/>
  <line x1="96" y1="142" x2="96" y2="154" stroke="white" stroke-width="1" opacity="0.5"/>
</svg>
