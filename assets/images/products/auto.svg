  <circle cx="65" cy="155" r="20" fill="rgba(255,255,255,0.3)"/>
  <circle cx="135" cy="155" r="20" fill="rgba(255,255,255,0.3)"/>
  <circle cx="65" cy="155" r="10" fill="rgba(255,255,255,0.7)"/>
  <circle cx="135" cy="155" r="10" fill="rgba(255,255,255,0.7)"/>
  <!-- Headlights -->
  <rect x="148" y="108" width="16" height="10" rx="3" fill="rgba(255,240,100,0.8)"/>
  <rect x="36" y="108" width="16" height="10" rx="3" fill="rgba(255,240,100,0.8)"/>
  <!-- Door line -->
  <line x1="100" y1="102" x2="100" y2="152" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
