  <circle cx="145" cy="135" r="19" fill="none" stroke="white" stroke-width="3" opacity="0.9"/>
  <circle cx="145" cy="135" r="10" fill="white" opacity="0.4"/>
  <circle cx="145" cy="135" r="4" fill="white" opacity="0.9"/>
  <line x1="145" y1="116" x2="145" y2="154" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="126" y1="135" x2="164" y2="135" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <!-- Rear wheel -->
  <circle cx="58" cy="135" r="19" fill="none" stroke="white" stroke-width="3" opacity="0.9"/>
  <circle cx="58" cy="135" r="10" fill="white" opacity="0.4"/>
  <circle cx="58" cy="135" r="4" fill="white" opacity="0.9"/>
  <line x1="58" y1="116" x2="58" y2="154" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="39" y1="135" x2="77" y2="135" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <!-- Door divider -->
  <line x1="103" y1="88" x2="103" y2="118" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <!-- Door handle front -->
  <rect x="108" y="104" width="12" height="3" rx="1.5" fill="white" opacity="0.7"/>
  <!-- Door handle rear -->
  <rect x="78" y="104" width="12" height="3" rx="1.5" fill="white" opacity="0.7"/>
