<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Piggy bank body (ellipse) -->
  <ellipse cx="100" cy="118" rx="58" ry="48" fill="white" opacity="0.9"/>
  <!-- Head (smaller circle to the right) -->
  <circle cx="148" cy="104" r="22" fill="white" opacity="0.9"/>
  <!-- Ear on head -->
  <ellipse cx="148" cy="84" rx="7" ry="10" fill="white" opacity="0.9"/>
  <ellipse cx="148" cy="84" rx="4" ry="6" fill="white" opacity="0.35"/>
  <!-- Snout -->
  <ellipse cx="166" cy="108" rx="10" ry="8" fill="white" opacity="0.6"/>
  <circle cx="163" cy="107" r="2.5" fill="white" opacity="0.35"/>
  <circle cx="169" cy="107" r="2.5" fill="white" opacity="0.35"/>
  <!-- Eye -->
  <circle cx="156" cy="98" r="3" fill="white" opacity="0.4"/>
  <!-- Coin slot on top of body -->
  <rect x="88" y="70" width="24" height="6" rx="3" fill="white" opacity="0.5"/>
  <!-- Coin going in -->
  <ellipse cx="100" cy="68" rx="10" ry="4" fill="white" opacity="0.7"/>
  <!-- Legs -->
  <rect x="65" y="160" width="12" height="22" rx="6" fill="white" opacity="0.9"/>
  <rect x="84" y="162" width="12" height="20" rx="6" fill="white" opacity="0.9"/>
  <rect x="104" y="162" width="12" height="20" rx="6" fill="white" opacity="0.9"/>
  <rect x="123" y="160" width="12" height="22" rx="6" fill="white" opacity="0.9"/>
  <!-- Tail (curl) -->
  <path d="M42 112 Q30 108 32 118 Q34 128 44 124" stroke="white" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
</svg>
