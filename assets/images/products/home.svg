<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Chimney (behind roof) -->
  <rect x="128" y="45" width="16" height="36" rx="2" fill="white" opacity="0.9"/>
  <!-- Roof -->
  <path d="M100 30 L22 90 L40 90 L40 170 L160 170 L160 90 L178 90 Z" fill="white" opacity="0.9"/>
  <!-- Roof overhang (slightly darker shade via opacity) -->
  <path d="M100 30 L22 90 L178 90 Z" fill="white" opacity="0.15"/>
  <!-- Left window -->
  <rect x="48" y="105" width="34" height="30" rx="3" fill="white" opacity="0.25"/>
  <line x1="65" y1="105" x2="65" y2="135" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="48" y1="120" x2="82" y2="120" stroke="white" stroke-width="2" opacity="0.7"/>
  <!-- Right window -->
  <rect x="118" y="105" width="34" height="30" rx="3" fill="white" opacity="0.25"/>
  <line x1="135" y1="105" x2="135" y2="135" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="118" y1="120" x2="152" y2="120" stroke="white" stroke-width="2" opacity="0.7"/>
  <!-- Door -->
  <rect x="83" y="128" width="34" height="42" rx="4" fill="white" opacity="0.3"/>
  <!-- Door arch top -->
  <path d="M83 140 Q83 128 100 128 Q117 128 117 140" fill="white" opacity="0.15"/>
  <!-- Door knob -->
  <circle cx="112" cy="150" r="3" fill="white" opacity="0.9"/>
  <!-- Door center line -->
  <line x1="100" y1="128" x2="100" y2="170" stroke="white" stroke-width="1.5" opacity="0.4"/>
</svg>
