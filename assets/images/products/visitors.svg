<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Canadian maple leaf centered top -->
  <path d="M100 22 L96 34 L84 31 L89 40 L80 44 L90 47 L87 58 L100 49 L113 58 L110 47 L120 44 L111 40 L116 31 L104 34 Z" fill="white" opacity="0.9"/>
  <!-- Maple leaf stem -->
  <line x1="100" y1="58" x2="100" y2="64" stroke="white" stroke-width="2.5" opacity="0.9"/>
  <!-- Person left — head -->
  <circle cx="72" cy="100" r="14" fill="white" opacity="0.9"/>
  <!-- Person left — body -->
  <path d="M52 148 Q52 122 72 122 Q92 122 92 148 L92 160 L52 160 Z" fill="white" opacity="0.9"/>
  <!-- Person right — head -->
  <circle cx="128" cy="100" r="14" fill="white" opacity="0.9"/>
  <!-- Person right — body -->
  <path d="M108 148 Q108 122 128 122 Q148 122 148 148 L148 160 L108 160 Z" fill="white" opacity="0.9"/>
  <!-- Arms slightly extended — person left -->
  <line x1="52" y1="132" x2="38" y2="148" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <!-- Arms slightly extended — person right -->
  <line x1="148" y1="132" x2="162" y2="148" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <!-- Inner arms touching (welcoming) -->
  <line x1="92" y1="130" x2="108" y2="130" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
